name: Build

# Every push: run the tests and build the Windows exe (downloadable from the
# run's "Artifacts" section).
# Publishing: when a push to main carries a version (wowconv/__init__.py) that
# has no release yet, a GitHub Release v<version> is created with the exe
# attached. Pushing a tag like v1.0.0, or creating the release on github.com,
# works too.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Lua 5.1 (for the end-to-end tests)
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Run tests
        run: python -m unittest discover -v tests

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.16.0
      - name: Build exe
        run: python -m PyInstaller --noconfirm WoWClassicConverter.spec
      - name: Smoke test the exe
        shell: pwsh
        run: |
          Compress-Archive -Path tests/fixtures/RetailDemo -DestinationPath RetailDemo.zip
          $p = Start-Process dist/WoWClassicConverter.exe -ArgumentList "RetailDemo.zip","-o","smoke.zip" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "exe exited with $($p.ExitCode)" }
          if (-not (Test-Path smoke.zip)) { throw "no output zip" }
      - uses: actions/upload-artifact@v4
        with:
          name: WoWClassicConverter-windows
          path: dist/WoWClassicConverter.exe
      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            # The release may already exist if it was created on github.com; then just attach the exe.
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" dist/WoWClassicConverter.exe --clobber
              exit 0
            fi
          else
            version=$(python -c "import wowconv; print(wowconv.__version__)")
            tag="v$version"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag is already released; bump __version__ in wowconv/__init__.py to publish a new one."
              exit 0
            fi
          fi
          gh release create "$tag" dist/WoWClassicConverter.exe --target "$GITHUB_SHA" --title "$tag" --generate-notes
